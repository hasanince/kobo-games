<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kobo Sudoku</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #f4f0e6;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
body {
  min-height: 100vh;
}
#app {
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 12px 22px 12px;
  box-sizing: border-box;
}
h1 {
  margin: 0 0 10px 0;
  text-align: center;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: 0.5px;
}
.topbar {
  display: table;
  width: 100%;
  table-layout: fixed;
  margin-bottom: 10px;
}
.topbar .cell {
  display: table-cell;
  vertical-align: middle;
  padding: 0 4px;
}
select, .action, .num {
  -webkit-appearance: none;
  appearance: none;
  border: 2px solid #202020;
  border-radius: 7px;
  background: #fffdf8;
  color: #111;
  font-size: 20px;
  font-weight: bold;
  min-height: 48px;
  box-sizing: border-box;
}
select {
  width: 100%;
  padding: 6px 8px;
}
.action {
  width: 100%;
  padding: 7px 10px;
}
.action:active, .num:active {
  background: #ded8ca;
}
#board-wrap {
  width: 96vw;
  max-width: 680px;
  margin: 0 auto 10px auto;
  box-sizing: border-box;
}
#board {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border: 4px solid #111;
  background: #fff;
}
#board td {
  width: 11.111%;
  height: 0;
  padding: 0;
  position: relative;
  border: 1px solid #777;
  text-align: center;
  vertical-align: middle;
  font-size: 28px;
  font-weight: normal;
  cursor: pointer;
  background: #fffdf8;
}
#board td:before {
  content: "";
  display: block;
  padding-top: 100%;
}
#board td .v {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  line-height: 1;
}
#board tr:nth-child(3) td,
#board tr:nth-child(6) td {
  border-bottom: 3px solid #111;
}
#board td:nth-child(3),
#board td:nth-child(6) {
  border-right: 3px solid #111;
}
#board td.given {
  background: #e3ded3;
  font-weight: bold;
}
#board td.peer {
  background: #f1ede4;
}
#board td.same {
  background: #e8e1cf;
}
#board td.selected {
  outline: 4px solid #1e5677;
  outline-offset: -4px;
  background: #dfeaf0;
}
#board td.wrong {
  color: #8a1010;
  background: #f0d9d3;
}
#number-pad {
  width: 100%;
  margin: 0 auto 8px auto;
  white-space: nowrap;
  text-align: center;
  font-size: 0;
}
.num {
  display: inline-block;
  vertical-align: top;
  width: 10.4%;
  margin: 0 0.35%;
  padding: 5px 0;
  min-height: 54px;
  text-align: center;
  font-size: 24px;
  box-sizing: border-box;
}
.controls {
  width: 100%;
  white-space: nowrap;
  text-align: center;
  font-size: 0;
}
.controls .action {
  display: inline-block;
  vertical-align: top;
  width: 23.8%;
  margin: 0 0.5%;
  font-size: 17px;
  box-sizing: border-box;
}
#status {
  min-height: 28px;
  margin: 7px 3px 0 3px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}
.small {
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  color: #4a4a4a;
}
@media (max-width: 520px) {
  #app { padding: 7px 5px 12px 5px; }
  h1 { font-size: 23px; margin-bottom: 6px; }
  #board-wrap { width: 98vw; margin-bottom: 7px; }
  #board td { font-size: 23px; }
  select, .action { min-height: 42px; font-size: 16px; }
  .num {
    width: 10.5%;
    margin: 0 0.25%;
    min-height: 46px;
    font-size: 21px;
    padding: 4px 0;
  }
  .controls .action {
    width: 24%;
    margin: 0 0.35%;
    font-size: 14px;
    padding-left: 2px;
    padding-right: 2px;
  }
  #status { font-size: 15px; min-height: 24px; }
  .small { font-size: 12px; }
}
@media (max-width: 390px) {
  #app { padding-left: 3px; padding-right: 3px; }
  #board-wrap { width: 99vw; }
  #board td { font-size: 21px; }
  .num {
    width: 10.55%;
    margin: 0 0.18%;
    min-height: 43px;
    font-size: 19px;
  }
  .controls .action {
    width: 24.1%;
    margin: 0 0.2%;
    font-size: 13px;
    padding-left: 1px;
    padding-right: 1px;
  }
}
@media (orientation: landscape) {
  #app { max-width: 1000px; }
  #board-wrap { width: 72vh; max-width: 600px; }
}
</style>
</head>
<body>
<div id="app">
  <h1>Sudoku</h1>

  <div class="topbar">
    <div class="cell">
      <select id="difficulty" aria-label="Zorluk">
        <option value="easy">Kolay</option>
        <option value="medium" selected>Orta</option>
        <option value="hard">Zor</option>
      </select>
    </div>
    <div class="cell">
      <button class="action" id="newBtn" type="button">Yeni Oyun</button>
    </div>
  </div>

  <div id="board-wrap">
    <table id="board" aria-label="Sudoku tahtası"></table>
  </div>

  <div id="number-pad" aria-label="Sayı tuşları"></div>

  <div class="controls">
    <button class="action" id="eraseBtn" type="button">Sil</button>
    <button class="action" id="checkBtn" type="button">Kontrol</button>
    <button class="action" id="hintBtn" type="button">İpucu</button>
    <button class="action" id="resetBtn" type="button">Sıfırla</button>
  </div>

  <div id="status"></div>
  <div class="small">Dokun: hücre seç → sayı gir. Oyun otomatik kaydedilir.</div>
</div>

<script>
(function () {
  "use strict";

  var PUZZLES = {"easy":[{"p":"207504603163020504054603007000008030015270040490005076070400000000000482802350061","s":"287594613163827594954613827726948135315276948498135276671482359539761482842359761"},{"p":"502080000001503004078600035150274908060100742200096301006001023000068500005300087","s":"532487196691523874478619235153274968869135742247896351786951423324768519915342687"},{"p":"392008040054020810001040029000670003060004098005002176006205081018400002003009764","s":"392718645654923817871546329289671453167354298435892176746235981918467532523189764"},{"p":"067503002583900170920007038205649817070000000000000250796308020000096081000050760","s":"167583942583924176924167538235649817871235694649871253796318425452796381318452769"},{"p":"400705000517000000038020001206091037194573020000600409900000080000269170741350206","s":"429715863517836942638924751286491537194573628375682419962147385853269174741358296"},{"p":"086307420000902800902580100734090500000730002090051000079800601103409000805103704","s":"586317429317942865942586173734298516651734982298651347479825631163479258825163794"}],"medium":[{"p":"041260000020089710050007302000040000800700653000006009013605008060800000407000596","s":"741263985326589714958417362635948127894721653172356849213695478569874231487132596"},{"p":"080094000492070810670100000906010000000050007013000569007040600200005081100900370","s":"381294756492576813675183924956317248824659137713428569537841692269735481148962375"},{"p":"000300086605709000321000407000000309000934610000201000579420801068000000400106000","s":"794312586685749123321658497216875349857934612943261758579423861168597234432186975"},{"p":"007000261060070000300012547005030000010006480002050910000507800706000129030001006","s":"547983261261475398398612547485139672913726485672854913129567834756348129834291756"},{"p":"180306090074000350030000000008040127207008943000127000009000430340070081060000000","s":"182356794974812356536794812658943127217568943493127568729681435345279681861435279"},{"p":"003000500480900760020800010700450030000000904000032806200704100070091020900326007","s":"193267548485913762627845319768459231312678954549132876236784195874591623951326487"}],"hard":[{"p":"800542009000700005020001800000190000080604502000000980050000070100000003203800650","s":"867542319319786425425931867532198746981674532746253981654329178178465293293817654"},{"p":"300261009600000005007000002070400001008790060500100030000009753035000000180005000","s":"354261879621987345897534612973456281218793564546128937462819753735642198189375426"},{"p":"000400100513000000060030008050000400000875096906000080080040005094700802005000010","s":"278496153513287649469531728857962431341875296926314587682149375194753862735628914"},{"p":"000000102500080030304200006003065090000098004008403501080012600000000900700000003","s":"867934152521687439394251786243165897615798324978423561489312675132576948756849213"},{"p":"000900000081300000304007001700804005020001000843000010090100000000079038000005297","s":"572918364981346572364527981719834625625791843843652719297183456456279138138465297"},{"p":"030007000400002805087006301000820050000000040970004000203000090000043087000050402","s":"132587964496132875587496321364821759821975643975364218243718596659243187718659432"}]};

  var boardEl = document.getElementById("board");
  var padEl = document.getElementById("number-pad");
  var difficultyEl = document.getElementById("difficulty");
  var statusEl = document.getElementById("status");

  var puzzle = "";
  var solution = "";
  var values = [];
  var selected = -1;
  var currentLevel = "medium";
  var currentIndex = 0;

  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }

  function storageSet(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) {}
  }

  function saveGame() {
    var data = {
      level: currentLevel,
      index: currentIndex,
      puzzle: puzzle,
      solution: solution,
      values: values.join(""),
      selected: selected
    };
    storageSet("koboSudokuStateV1", JSON.stringify(data));
  }

  function loadSavedGame() {
    var raw = storageGet("koboSudokuStateV1");
    if (!raw) { return false; }

    try {
      var data = JSON.parse(raw);
      if (!data || !data.puzzle || !data.solution || !data.values) { return false; }
      if (data.puzzle.length !== 81 || data.solution.length !== 81 || data.values.length !== 81) { return false; }

      currentLevel = data.level || "medium";
      currentIndex = typeof data.index === "number" ? data.index : 0;
      puzzle = data.puzzle;
      solution = data.solution;
      values = data.values.split("");
      selected = typeof data.selected === "number" ? data.selected : -1;
      difficultyEl.value = currentLevel;
      return true;
    } catch (e) {
      return false;
    }
  }

  function randomIndex(max) {
    return Math.floor(Math.random() * max);
  }

  function startNew(level) {
    currentLevel = level || difficultyEl.value || "medium";
    var list = PUZZLES[currentLevel];
    var next = randomIndex(list.length);

    if (list.length > 1 && next === currentIndex && currentLevel === difficultyEl.value) {
      next = (next + 1) % list.length;
    }

    currentIndex = next;
    puzzle = list[next].p;
    solution = list[next].s;
    values = puzzle.split("");
    selected = -1;
    difficultyEl.value = currentLevel;
    statusEl.innerHTML = "";
    renderBoard();
    saveGame();
  }

  function renderBoard() {
    var html = "";
    var r, c, i, cls, value;

    for (r = 0; r < 9; r++) {
      html += "<tr>";
      for (c = 0; c < 9; c++) {
        i = r * 9 + c;
        cls = cellClasses(i);
        value = values[i] === "0" ? "" : values[i];
        html += '<td data-i="' + i + '" class="' + cls + '"><span class="v">' + value + "</span></td>";
      }
      html += "</tr>";
    }
    boardEl.innerHTML = html;
    bindCells();
  }

  function cellClasses(i) {
    var classes = [];
    if (puzzle.charAt(i) !== "0") { classes.push("given"); }

    if (selected >= 0) {
      var sr = Math.floor(selected / 9);
      var sc = selected % 9;
      var r = Math.floor(i / 9);
      var c = i % 9;

      if (r === sr || c === sc || (Math.floor(r/3) === Math.floor(sr/3) && Math.floor(c/3) === Math.floor(sc/3))) {
        classes.push("peer");
      }

      if (values[selected] !== "0" && values[i] === values[selected]) {
        classes.push("same");
      }

      if (i === selected) {
        classes.push("selected");
      }
    }

    return classes.join(" ");
  }

  function bindCells() {
    var cells = boardEl.getElementsByTagName("td");
    var i;
    for (i = 0; i < cells.length; i++) {
      cells[i].onclick = function () {
        var idx = parseInt(this.getAttribute("data-i"), 10);
        selected = idx;
        clearWrongMarks();
        renderBoard();
        saveGame();
      };
    }
  }

  function clearWrongMarks() {
    var cells = boardEl.getElementsByTagName("td");
    var i;
    for (i = 0; i < cells.length; i++) {
      cells[i].className = cells[i].className.replace(/\bwrong\b/g, "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
    }
  }

  function setValue(n) {
    if (selected < 0) {
      statusEl.innerHTML = "Önce bir hücre seç.";
      return;
    }
    if (puzzle.charAt(selected) !== "0") {
      statusEl.innerHTML = "Bu sayı sabit.";
      return;
    }
    values[selected] = String(n);
    statusEl.innerHTML = "";
    renderBoard();
    saveGame();
    if (isComplete()) {
      statusEl.innerHTML = "Tebrikler — Sudoku tamamlandı.";
    }
  }

  function eraseSelected() {
    if (selected < 0) {
      statusEl.innerHTML = "Önce bir hücre seç.";
      return;
    }
    if (puzzle.charAt(selected) !== "0") {
      statusEl.innerHTML = "Bu sayı sabit.";
      return;
    }
    values[selected] = "0";
    statusEl.innerHTML = "";
    renderBoard();
    saveGame();
  }

  function checkBoard() {
    var cells = boardEl.getElementsByTagName("td");
    var wrong = 0;
    var empty = 0;
    var i;

    for (i = 0; i < 81; i++) {
      if (values[i] === "0") {
        empty++;
      } else if (values[i] !== solution.charAt(i)) {
        wrong++;
        cells[i].className += " wrong";
      }
    }

    if (wrong > 0) {
      statusEl.innerHTML = wrong + " hatalı hücre var.";
    } else if (empty > 0) {
      statusEl.innerHTML = "Şimdilik hata yok. " + empty + " hücre boş.";
    } else {
      statusEl.innerHTML = "Tebrikler — Sudoku tamamlandı.";
    }
  }

  function giveHint() {
    var candidates = [];
    var i;

    if (selected >= 0 && puzzle.charAt(selected) === "0" && values[selected] !== solution.charAt(selected)) {
      values[selected] = solution.charAt(selected);
      statusEl.innerHTML = "Seçili hücre dolduruldu.";
    } else {
      for (i = 0; i < 81; i++) {
        if (puzzle.charAt(i) === "0" && values[i] !== solution.charAt(i)) {
          candidates.push(i);
        }
      }
      if (candidates.length === 0) {
        statusEl.innerHTML = "İpucu gerekmiyor.";
        return;
      }
      i = candidates[randomIndex(candidates.length)];
      values[i] = solution.charAt(i);
      selected = i;
      statusEl.innerHTML = "Bir hücre dolduruldu.";
    }

    renderBoard();
    saveGame();
    if (isComplete()) {
      statusEl.innerHTML = "Tebrikler — Sudoku tamamlandı.";
    }
  }

  function resetGame() {
    var i;
    for (i = 0; i < 81; i++) {
      values[i] = puzzle.charAt(i);
    }
    selected = -1;
    statusEl.innerHTML = "Tahta başlangıç durumuna döndü.";
    renderBoard();
    saveGame();
  }

  function isComplete() {
    var i;
    for (i = 0; i < 81; i++) {
      if (values[i] !== solution.charAt(i)) { return false; }
    }
    return true;
  }

  function buildPad() {
    var html = "";
    var n;
    for (n = 1; n <= 9; n++) {
      html += '<button class="num" type="button" data-n="' + n + '">' + n + "</button>";
    }
    padEl.innerHTML = html;

    var buttons = padEl.getElementsByTagName("button");
    var i;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].onclick = function () {
        setValue(this.getAttribute("data-n"));
      };
    }
  }

  document.getElementById("newBtn").onclick = function () {
    startNew(difficultyEl.value);
  };

  document.getElementById("eraseBtn").onclick = eraseSelected;
  document.getElementById("checkBtn").onclick = checkBoard;
  document.getElementById("hintBtn").onclick = giveHint;
  document.getElementById("resetBtn").onclick = resetGame;

  difficultyEl.onchange = function () {
    startNew(difficultyEl.value);
  };

  document.onkeydown = function (e) {
    e = e || window.event;
    var code = e.keyCode || e.which;
    if (code >= 49 && code <= 57) {
      setValue(code - 48);
    } else if (code >= 97 && code <= 105) {
      setValue(code - 96);
    } else if (code === 8 || code === 46) {
      eraseSelected();
      if (e.preventDefault) { e.preventDefault(); }
      return false;
    }
  };

  function fitBoard() {
    var wrap = document.getElementById("board-wrap");
    var vw = window.innerWidth || document.documentElement.clientWidth || 700;
    var vh = window.innerHeight || document.documentElement.clientHeight || 900;

    if (vw > vh) {
      var landscapeSize = Math.floor(vh * 0.70);
      if (landscapeSize > 600) { landscapeSize = 600; }
      if (landscapeSize < 300) { landscapeSize = 300; }
      wrap.style.width = landscapeSize + "px";
    } else {
      var portraitSize = Math.floor(vw * 0.96);
      if (portraitSize > 680) { portraitSize = 680; }
      wrap.style.width = portraitSize + "px";
    }
  }

  window.onresize = fitBoard;
  window.onorientationchange = function () {
    setTimeout(fitBoard, 100);
  };

  buildPad();
  fitBoard();
  if (!loadSavedGame()) {
    startNew("medium");
  } else {
    renderBoard();
    if (isComplete()) {
      statusEl.innerHTML = "Tebrikler — Sudoku tamamlandı.";
    }
  }
}());
</script>
</body>
</html>
